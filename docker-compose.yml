services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "yourStrong(!)Password"
    ports:
      - "5962:1433"

  api:
    build: .
    ports:
      - "2695:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MotoGPDB: "Server=sqlserver;Database=MotoGPDB;User Id=sa;Password=yourStrong(!)Password;TrustServerCertificate=True;"
    depends_on:
      - sqlserver